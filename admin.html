<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Bewerbungen Admin</title>
    
    <!-- Die offizielle Minecraft Überschriften-Schriftart -->
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

    <style>
        :root {
            /* Clean Dark Theme */
            --bg-base: #111111; 
            --bg-surface: #1e1e1e;
            --bg-card: #27272a;
            --border-color: #000;
            
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            --accent-main: #b057f8;
            
            /* Status Colors */
            --mc-green: #4ade80; 
            --mc-red: #f87171; 
            --mc-nether-purple: #b057f8;
            
            /* Book Theme */
            --book-bg: #fdf6e3;
            --book-border: #8b7355;
            --book-text: #1a1a1a;
        }

        /* Anti-Diebstahl Schutz */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #555; }

        body, html { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; display: flex;
            width: 100vw;
        }

        .mc-font, h1, h2, h3, h4 {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        .discord-tag {
            text-transform: none !important;
            font-family: "Segoe UI", sans-serif;
            font-weight: bold;
            color: var(--text-muted);
        }

        .hidden { display: none !important; }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 9998;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: var(--bg-surface); border: 2px solid #000; padding: 50px; text-align: center;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        .login-box h1 { font-size: 2.5rem; color: var(--accent-main); margin-bottom: 20px; text-shadow: 2px 2px 0px #000;}
        .login-box p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;}
        .btn-login {
            background: #fff; color: #000; padding: 15px 30px; font-size: 1.4rem; cursor: pointer; border: 2px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; margin: 0 auto; transition: 0.1s;
            font-family: 'Minecraft', sans-serif; text-transform: uppercase;
        }
        .btn-login:hover { background: #eee; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px rgba(0,0,0,0.6); }
        .btn-login:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px; }
        .google-icon { width: 24px; height: 24px; }

        .logout-btn { background: #333; color: #fff; border: 2px solid #000; padding: 8px 16px; cursor: pointer; font-size: 1rem; transition: 0.1s; box-shadow: 2px 2px 0px rgba(0,0,0,0.5); font-family: 'Minecraft', sans-serif; text-transform: uppercase;}
        .logout-btn:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px; }

        /* --- CHEST START ANIMATION --- */
        #chest-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111111; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.4s ease;
        }
        .real-chest {
            width: 128px; height: 128px; image-rendering: pixelated;
            animation: pulseChest 1s infinite alternate; filter: drop-shadow(0px 10px 0px rgba(0,0,0,0.8));
        }
        .loading-text { margin-top: 30px; font-size: 2rem; color: #fff; text-shadow: 2px 2px 0px #000; }
        @keyframes pulseChest { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
        .chest-open-effect { transform: scale(2) !important; filter: drop-shadow(0px 0px 50px var(--mc-green)) !important; opacity: 0; transition: all 0.5s ease; }

        /* --- DASHBOARD LAYOUT --- */
        #dashboard-wrapper { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }

        /* --- DER ORIGINALE MINECRAFT.NET MARKETPLACE HINTERGRUND --- */
        .main-content {
            flex-grow: 1; display: flex; flex-direction: column; position: relative;
            background-color: #161616;
            background-image: 
                radial-gradient(circle at 50% 100%, rgba(176, 87, 248, 0.15) 0%, rgba(22, 22, 22, 0) 60%),
                linear-gradient(to bottom, #111111 0%, #1a1a1a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-content::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 300px;
            background-image: 
                radial-gradient(2px 2px at 20px 50px, rgba(176, 87, 248, 0.6) 50%, transparent 100%),
                radial-gradient(2px 2px at 150px 120px, rgba(148, 0, 211, 0.8) 50%, transparent 100%),
                radial-gradient(3px 3px at 300px 80px, rgba(218, 112, 214, 0.5) 50%, transparent 100%),
                radial-gradient(2px 2px at 500px 180px, rgba(176, 87, 248, 0.7) 50%, transparent 100%),
                radial-gradient(2px 2px at 700px 90px, rgba(148, 0, 211, 0.6) 50%, transparent 100%),
                radial-gradient(3px 3px at 900px 150px, rgba(176, 87, 248, 0.5) 50%, transparent 100%),
                radial-gradient(2px 2px at 1100px 60px, rgba(218, 112, 214, 0.7) 50%, transparent 100%);
            background-repeat: repeat;
            background-size: 1200px 300px;
            animation: floatParticles 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatParticles {
            0% { transform: translateY(0px); opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-50px); opacity: 0.8; }
        }
        
        .topbar {
            height: 80px; background-color: #111; border-bottom: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
            position: sticky; top: 0; z-index: 90;
        }
        
        .topbar-left { display: flex; align-items: center; gap: 30px; z-index: 2; }
        .admin-badge {
            background-color: var(--accent-main); color: #000; padding: 6px 16px;
            font-size: 1.2rem; border: 2px solid #000; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .topbar-title { font-size: 1.8rem; text-shadow: 2px 2px 0px #000; color: #fff;}
        
        .user-actions { display: flex; gap: 20px; align-items: center; z-index: 2; }

        .search-bar { 
            width: 300px; padding: 10px 15px; border: 2px solid var(--border-color); 
            background: #222; color: white; font-size: 1rem; font-family: "Segoe UI", sans-serif;
            transition: 0.1s;
        }
        .search-bar:focus { outline: none; border-color: var(--accent-main); }
        
        .content-area { padding: 40px; max-width: 1200px; width: 100%; margin: 0 auto; position: relative; z-index: 2; }

        /* --- DAS RING-DIAGRAMM --- */
        .dashboard-header-area {
            display: flex; align-items: center; gap: 60px; margin-bottom: 40px;
            background: var(--bg-surface); border: 2px solid #000; padding: 30px 40px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        .donut-container { position: relative; width: 130px; height: 130px; }
        .donut-chart {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(
                var(--mc-green) 0% var(--pct-accept),
                var(--mc-red) var(--pct-accept) calc(var(--pct-accept) + var(--pct-reject)),
                var(--mc-nether-purple) calc(var(--pct-accept) + var(--pct-reject)) 100%
            );
            display: flex; justify-content: center; align-items: center;
        }
        .donut-hole {
            width: 90px; height: 90px; background: var(--bg-surface); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; color: #fff; text-shadow: 2px 2px 0px #000;
        }
        .stats-legend { display: flex; flex-direction: column; gap: 15px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-family: "Segoe UI", sans-serif; font-weight: 600; color: #fff; }
        .legend-color { width: 14px; height: 14px; border: 2px solid #000; }

        /* --- TABS --- */
        .tabs-container { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab-btn {
            background: #222; border: 2px solid #000; color: var(--text-muted);
            padding: 12px 24px; font-size: 1.2rem; cursor: pointer; transition: 0.1s;
        }
        .tab-btn:hover { background: #333; color: white; }
        .tab-btn.active { background: var(--bg-card); color: var(--accent-main); border-bottom: 4px solid var(--accent-main); text-shadow: 1px 1px 0px #000; }

        /* --- LIST VIEW --- */
        #list-view { display: grid; grid-template-columns: 1fr; gap: 15px; }
        
        .ticket-card { 
            background: var(--bg-surface); border: 2px solid #000; 
            padding: 15px 25px; cursor: pointer; display: flex; 
            align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5); transition: 0.1s;
        }
        .ticket-card:hover { transform: translateY(-2px); box-shadow: 4px 4px 0px rgba(0,0,0,0.8); background: var(--bg-card); }
        
        .ticket-card.angenommen { border-color: var(--mc-green); }
        .ticket-card.abgelehnt { border-color: var(--mc-red); }

        .empty-box {
            background: rgba(30,30,30,0.4) !important; box-shadow: none !important;
            border: 2px dashed #444 !important; cursor: default !important; height: 100px;
        }

        .ticket-main { display: flex; align-items: center; gap: 20px; flex: 1; }
        
        .ticket-avatar {
            width: 50px; height: 50px; border: 2px solid #000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5); image-rendering: pixelated; background-color: #000;
        }

        .ticket-info h3 { margin: 0 0 4px 0; font-size: 1.4rem; color: var(--text-main); }
        .ticket-info p { margin: 0; font-size: 0.9rem; color: var(--text-muted); font-family: "Segoe UI", sans-serif; font-weight: 500;}
        .ticket-meta { display: flex; align-items: center; gap: 20px; }
        .ticket-date { font-size: 0.85rem; color: var(--text-muted); font-family: "Segoe UI", sans-serif;}

        .badge { font-size: 1rem; padding: 4px 8px; border: 2px solid #000; box-shadow: 1px 1px 0px rgba(0,0,0,0.5); }
        .badge-mod { background: var(--mc-green); color: #000; }
        .badge-vip { background: #be185d; color: #fff; }

        /* --- SUCH-LISTE --- */
        .search-list-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(20, 20, 20, 0.95); border: 2px solid #000; padding: 12px 20px;
            margin-bottom: 10px; cursor: pointer; transition: 0.1s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .search-list-item.angenommen { border-color: var(--mc-green); }
        .search-list-item.abgelehnt { border-color: var(--mc-red); }
        .search-list-item:hover { background: #27272a; transform: translateX(5px); box-shadow: 4px 4px 0px rgba(0,0,0,0.8); }
        .search-main { display: flex; align-items: center; gap: 15px; }
        .search-avatar { width: 40px; height: 40px; border: 2px solid #000; image-rendering: pixelated; background: #000; box-shadow: 2px 2px 0px rgba(0,0,0,0.5);}
        .search-name { font-size: 1.4rem; color: #fff; text-shadow: 1px 1px 0px #000; margin: 0; }
        .search-discord { font-size: 0.95rem; margin-left: 10px;}
        .search-status { font-size: 1.4rem; text-transform: uppercase; text-shadow: 1px 1px 0px #000; }
        
        /* --- DETAIL VIEW --- */
        #detail-view { 
            background: var(--bg-surface); border: 2px solid #000; display: flex; flex-direction: column; min-height: 600px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        #detail-view.angenommen { border-color: var(--mc-green); box-shadow: 4px 4px 0px var(--mc-green-dark); }
        #detail-view.abgelehnt { border-color: var(--mc-red); box-shadow: 4px 4px 0px var(--mc-red-dark); }

        .detail-topbar { padding: 15px 30px; border-bottom: 2px solid #000; display: flex; justify-content: space-between; align-items: center; background: #111; }
        
        .btn-outline { 
            background: #222; border: 2px solid #000; color: var(--text-main); padding: 8px 16px; 
            cursor: pointer; font-size: 1.1rem; box-shadow: 2px 2px 0px rgba(0,0,0,0.5); transition: 0.1s;
        }
        .btn-outline:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px; }

        .detail-content { padding: 40px; flex-grow: 1; }
        
        .detail-header { display: flex; align-items: center; gap: 25px; margin-bottom: 30px; border-bottom: 2px solid #3f3f46; padding-bottom: 20px; }
        .skin-3d { height: 120px; image-rendering: pixelated; filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5)); }
        .detail-header h2 { margin: 0 0 10px 0; font-size: 2.2rem; display: flex; align-items: center; gap: 15px; }
        
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .data-item strong { color: var(--text-muted); display: block; margin-bottom: 5px; font-size: 0.85rem; font-family: "Segoe UI", sans-serif; font-weight: bold; text-transform: uppercase;}
        .data-item span { font-size: 1.2rem; color: var(--text-main); font-family: "Segoe UI", sans-serif; font-weight: 500;}

        /* --- MINECRAFT BUCH STYLE --- */
        .qa-section { display: flex; flex-direction: column; gap: 25px; }
        .qa-block { 
            background: var(--book-bg); border: 2px solid var(--book-border); padding: 25px; 
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2); color: var(--book-text);
        }
        .qa-block strong { 
            color: #000; display: block; margin-bottom: 10px; font-size: 1.2rem; 
            border-bottom: 2px dotted #8b7355; padding-bottom: 8px;
        }
        .qa-block p { 
            margin: 0; font-family: "Segoe UI", sans-serif; font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; font-weight: 500;
        }

        /* ACTION BUTTONS */
        .action-bar { display: flex; gap: 15px; margin-top: 40px; padding-top: 30px; border-top: 2px solid #3f3f46; }
        .btn-action { 
            padding: 15px 25px; cursor: pointer; font-size: 1.4rem; border: 2px solid #000; 
            box-shadow: 4px 4px 0px rgba(0,0,0,0.4); flex: 1; text-align: center; transition: 0.1s;
        }
        .btn-action:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px rgba(0,0,0,0.4); }
        .btn-accept { background: var(--mc-green); color: #000; }
        .btn-reject { background: var(--mc-red); color: #000; }

        .revert-bar { margin-top: 40px; padding: 20px; background: #111; border: 2px solid #000; display: flex; justify-content: space-between; align-items: center; }
        .btn-revert { background: #333; color: white; border: 2px solid #000; padding: 10px 20px; cursor: pointer; font-size: 1.1rem; }

        /* --- ACHIEVEMENT ANIMATION --- */
        #achievement-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0); pointer-events: none; z-index: 9998;
            transition: background 0.3s ease;
        }
        #achievement-backdrop.show { background: rgba(0,0,0,0.8); }

        #achievement-toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 480px; background: #212121; border: 4px solid #000;
            display: flex; align-items: center; padding: 25px; z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s, left 0.6s ease-in;
            opacity: 0;
        }
        #achievement-toast.show { 
            transform: translate(-50%, -50%) scale(1.2); opacity: 1; left: 50%;
        }
        #achievement-toast.slide-out {
            left: 150%; opacity: 0; transform: translate(0, -50%) scale(1.2);
        }

        #achievement-toast.accept { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.2), 0 0 80px rgba(85,255,85,0.4); }
        #achievement-toast.reject { box-shadow: inset 4px 4px 0px rgba(255,255,255,0.2), 0 0 80px rgba(255,85,85,0.4); }
        
        .ach-icon {
            width: 64px; height: 64px; border: 2px solid #000; margin-right: 25px;
            flex-shrink: 0; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            image-rendering: pixelated; background: #000;
        }
        
        .ach-content { display: flex; flex-direction: column; }
        .ach-title { color: #FFFF55; font-size: 1.4rem; margin-bottom: 4px; text-shadow: 2px 2px 0px #000; }
        .ach-desc { color: #FFF; font-family: "Segoe UI", sans-serif; font-size: 1.1rem; font-weight: bold; }

    </style>
</head>
<body>

    <!-- LADEBILDSCHIRM -->
    <div id="chest-overlay">
        <img src="https://minotar.net/helm/MHF_Chest/128.png" id="loading-chest" class="real-chest" alt="Chest">
        <div class="loading-text mc-font">DATENBANK...</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="hidden">
        <div class="login-box">
            <h1 class="mc-font">Admin Zugang</h1>
            <p>Bitte logge dich mit deinem Google-Konto ein.</p>
            <button class="btn-login mc-font" id="btn-login">
                <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path><path fill="none" d="M0 0h48v48H0z"></path></svg>
                Mit Google einloggen
            </button>
        </div>
    </div>

    <!-- ACHIEVEMENT POPUP & BACKDROP -->
    <div id="achievement-backdrop"></div>
    <div id="achievement-toast">
        <img src="" id="ach-icon" class="ach-icon" alt="Skin">
        <div class="ach-content">
            <div id="ach-title" class="ach-title mc-font">Achievement Get!</div>
            <div id="ach-desc" class="ach-desc">Status Aktualisiert</div>
        </div>
    </div>

    <div id="dashboard-wrapper" class="hidden">
        <main class="main-content">
            
            <header class="topbar">
                <div class="topbar-left">
                    <div class="admin-badge mc-font">Admin Panel</div>
                    <div class="topbar-title mc-font">Bewerbungen</div>
                </div>
                <div class="user-actions">
                    <input type="text" id="search-input" class="search-bar" placeholder="Suchen...">
                    <button class="logout-btn mc-font" id="btn-logout">Logout</button>
                </div>
            </header>

            <div class="content-area">
                
                <div id="list-view-container">
                    
                    <div class="dashboard-header-area">
                        <div class="donut-container">
                            <div class="donut-chart" id="donut-chart">
                                <div class="donut-hole mc-font" id="stat-total">0</div>
                            </div>
                        </div>
                        <div class="stats-legend">
                            <div class="legend-item"><div class="legend-color" style="background: var(--mc-green);"></div> Angenommen (<span id="stat-accept-txt">0</span>)</div>
                            <div class="legend-item"><div class="legend-color" style="background: var(--mc-nether-purple);"></div> Offen (<span id="stat-offen-txt">0</span>)</div>
                            <div class="legend-item"><div class="legend-color" style="background: var(--mc-red);"></div> Abgelehnt (<span id="stat-reject-txt">0</span>)</div>
                        </div>
                    </div>

                    <div class="tabs-container">
                        <button class="tab-btn active mc-font" onclick="switchTab('offen')" id="tab-offen">Offen <span id="count-offen"></span></button>
                        <button class="tab-btn mc-font" onclick="switchTab('angenommen')" id="tab-angenommen">Angenommen <span id="count-angenommen"></span></button>
                        <button class="tab-btn mc-font" onclick="switchTab('abgelehnt')" id="tab-abgelehnt">Abgelehnt <span id="count-abgelehnt"></span></button>
                    </div>

                    <div id="list-view"></div>
                </div>

                <div id="detail-view" class="hidden">
                    <div class="detail-topbar">
                        <span class="mc-font" style="color: var(--text-muted); font-size: 1.2rem;">Bewerbung lesen</span>
                        <button class="btn-outline mc-font" onclick="closeDetail()">Zurück</button>
                    </div>
                    <div id="detail-container"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- FIREBASE & LOGIK SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyA48CGXIa3FFe8AOJ0n-uVSkPxHo1EHLOw",
            authDomain: "lerokes-bewerbung.firebaseapp.com",
            projectId: "lerokes-bewerbung",
            storageBucket: "lerokes-bewerbung.firebasestorage.app",
            messagingSenderId: "504158166281",
            appId: "1:504158166281:web:e69210f352131dcd5c47d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // --- ANTI-DEVTOOLS SCHUTZ ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Strg+U
        };

        // --- GLOBALE VARIABLEN ---
        window.allApplications = [];
        let currentFilter = 'offen'; 
        
        const chestOverlay = document.getElementById('chest-overlay');
        const loginScreen = document.getElementById('login-screen');
        const dashboardWrapper = document.getElementById('dashboard-wrapper');
        const searchInput = document.getElementById('search-input');
        const listView = document.getElementById('list-view');
        const listViewContainer = document.getElementById('list-view-container');
        const detailView = document.getElementById('detail-view');
        const detailContainer = document.getElementById('detail-container');

        // --- LOGIN & AUTH LOGIK ---
        document.getElementById('btn-login').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => alert("Login fehlgeschlagen: " + err.message));
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                loginScreen.classList.add('hidden');
                await fetchApplications();
                dashboardWrapper.classList.remove('hidden');
                
                // Chest erst ausblenden, wenn Firebase-Daten geladen wurden
                setTimeout(() => {
                    document.getElementById('loading-chest').classList.add('chest-open-effect');
                    setTimeout(() => {
                        chestOverlay.style.opacity = '0';
                        setTimeout(() => chestOverlay.style.display = 'none', 400);
                    }, 300);
                }, 500);

            } else {
                dashboardWrapper.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                chestOverlay.style.display = 'none'; // Versteckt Ladescreen
            }
        });

        // --- DATENBANK ABRUF ---
        async function fetchApplications() {
            try {
                const querySnapshot = await getDocs(collection(db, "bewerbungen"));
                window.allApplications = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    data.id = docSnap.id;
                    // Timestamp sicher parsen
                    data.eingereicht_am = data.eingereicht_am ? data.eingereicht_am.toDate() : new Date();
                    window.allApplications.push(data);
                });
                
                // Neueste zuerst
                window.allApplications.sort((a,b) => b.eingereicht_am - a.eingereicht_am);
                
                updateStats();
                renderList(getFilteredApps());
            } catch(e) {
                alert("Fehler beim Laden der Datenbank. Stelle sicher, dass deine E-Mail in den Firebase Rules eingetragen ist.");
                console.error(e);
            }
        }

        // --- UI LOGIK ---
        window.switchTab = function(status) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + status).classList.add('active');
            renderList(getFilteredApps());
        };

        function getFilteredApps() {
            let filtered = window.allApplications.filter(app => app.status === currentFilter);
            const term = searchInput.value.toLowerCase();
            if(term) {
                filtered = filtered.filter(app => {
                    return (app.name || '').toLowerCase().includes(term) || (app.minecraft_name || '').toLowerCase().includes(term);
                });
            }
            return filtered;
        }

        function updateStats() {
            const total = window.allApplications.length;
            const accepted = window.allApplications.filter(a => a.status === 'angenommen').length;
            const rejected = window.allApplications.filter(a => a.status === 'abgelehnt').length;
            const open = window.allApplications.filter(a => a.status === 'offen').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-accept-txt').innerText = accepted;
            document.getElementById('stat-reject-txt').innerText = rejected;
            document.getElementById('stat-offen-txt').innerText = open;
            
            document.getElementById('count-offen').innerText = open;
            document.getElementById('count-angenommen').innerText = accepted;
            document.getElementById('count-abgelehnt').innerText = rejected;

            const pctAccept = total === 0 ? 0 : (accepted / total) * 100;
            const pctReject = total === 0 ? 0 : (rejected / total) * 100;

            const donut = document.getElementById('donut-chart');
            donut.style.setProperty('--pct-accept', pctAccept + '%');
            donut.style.setProperty('--pct-reject', pctReject + '%');
        }

        searchInput.addEventListener('input', () => { 
            const term = searchInput.value.toLowerCase();
            const headerArea = document.querySelector('.dashboard-header-area');
            const tabsArea = document.querySelector('.tabs-container');

            if(term) {
                headerArea.style.display = 'none';
                tabsArea.style.display = 'none';
                let filtered = window.allApplications.filter(app => {
                    return (app.name || '').toLowerCase().includes(term) || (app.minecraft_name || '').toLowerCase().includes(term);
                });
                renderSearchList(filtered);
            } else {
                headerArea.style.display = 'flex';
                tabsArea.style.display = 'flex';
                renderList(getFilteredApps());
            }
        });

        function renderSearchList(apps) {
            if(apps.length === 0) {
                listView.innerHTML = '<div class="ticket-card empty-box" style="height: 100px; justify-content: center;"><span class="mc-font" style="color: #888; font-size: 1.2rem;">Kein Spieler gefunden.</span></div>';
                return;
            }
            
            let html = '<h3 class="mc-font" style="color: var(--accent-main); margin-bottom: 5px; font-size: 1.4rem; text-shadow: 2px 2px 0px #000;">Suchergebnisse</h3>';
            apps.forEach((app) => {
                const nameDisplay = app.minecraft_name || app.name || 'Unbekannt';
                let mcName = app.minecraft_name;
                if (!mcName || mcName.trim() === '') { mcName = 'Steve'; }
                const avatarUrl = `https://minotar.net/helm/${mcName}/32.png`;
                
                let statusColor = '#fff';
                let statusClass = '';
                if(app.status === 'angenommen') { statusColor = 'var(--mc-green)'; statusClass = 'angenommen'; }
                if(app.status === 'abgelehnt') { statusColor = 'var(--mc-red)'; statusClass = 'abgelehnt'; }
                if(app.status === 'offen') statusColor = 'var(--mc-nether-purple)';

                html += `
                    <div class="search-list-item ${statusClass}" onclick="showDetail('${app.id}')">
                        <div class="search-main">
                            <img src="${avatarUrl}" alt="MC Skin" class="search-avatar" onerror="this.src='https://minotar.net/helm/Steve/32.png'">
                            <span class="search-name mc-font">${nameDisplay}</span>
                            <span class="search-discord discord-tag">${app.discordTag || '-'}</span>
                        </div>
                        <div class="search-status mc-font" style="color: ${statusColor};">${app.status}</div>
                    </div>
                `;
            });
            listView.innerHTML = html;
        }

        function renderList(apps) {
            if(apps.length === 0) {
                listView.innerHTML = '<div class="ticket-card empty-box"></div>';
                return;
            }

            let html = '';
            apps.forEach((app) => {
                const date = app.eingereicht_am ? app.eingereicht_am.toLocaleDateString('de-DE') : 'Neu';
                const roleText = app.rolle === 'mod' ? 'Mod' : 'VIP';
                const badgeClass = app.rolle === 'mod' ? 'badge badge-mod' : 'badge badge-vip';
                const nameDisplay = app.minecraft_name || app.name || 'Unbekannt';
                
                let mcName = app.minecraft_name;
                if (!mcName || mcName.trim() === '') { mcName = 'Steve'; }
                const avatarUrl = `https://minotar.net/helm/${mcName}/64.png`;

                let statusClass = '';
                if(app.status === 'angenommen') statusClass = 'angenommen';
                if(app.status === 'abgelehnt') statusClass = 'abgelehnt';

                html += `
                    <div class="ticket-card ${statusClass}" onclick="showDetail('${app.id}')">
                        <div class="ticket-main">
                            <img src="${avatarUrl}" alt="MC Skin" class="ticket-avatar" onerror="this.src='https://minotar.net/helm/Steve/64.png'">
                            <div class="ticket-info">
                                <h3 class="mc-font">${nameDisplay}</h3>
                                <p>Discord: <span class="discord-tag">${app.discordTag || '-'}</span></p>
                            </div>
                        </div>
                        <div class="ticket-meta">
                            <span class="${badgeClass} mc-font">${roleText}</span>
                            <span class="ticket-date">${date}</span>
                        </div>
                    </div>
                `;
            });
            listView.innerHTML = html;
        }

        window.showDetail = function(id) {
            const app = window.allApplications.find(a => a.id === id);
            if(!app) return;

            const date = app.eingereicht_am ? app.eingereicht_am.toLocaleString('de-DE') : 'Gerade eben';
            const roleText = app.rolle === 'mod' ? 'Moderator' : 'VIP Member';
            const badgeClass = app.rolle === 'mod' ? 'badge badge-mod' : 'badge badge-vip';
            const nameDisplay = app.minecraft_name || app.name || 'Unbekannt';

            let mcName = app.minecraft_name;
            if (!mcName || mcName.trim() === '') { mcName = 'Steve'; }
            const bodyUrl = `https://minotar.net/armor/body/${mcName}/150.png`;

            // STREAM WARNUNG
            let privateWarning = '';
            if(app.on_stream === 'nein') {
                privateWarning = `<div style="background: var(--mc-red-dark); color: #fff; padding: 15px; margin-bottom: 25px; border: 2px solid #000; font-weight: bold; text-align: center; text-transform: uppercase;">⚠️ ACHTUNG: DARF NICHT IM STREAM GEZEIGT WERDEN! ⚠️</div>`;
            }

            let roleQuestions = app.rolle === 'vip' ? `
                <div class="qa-block">
                    <strong class="mc-font">Warum VIP Badge?</strong>
                    <p>${app.warum_vip || '-'}</p>
                </div>
                <div class="qa-block">
                    <strong class="mc-font">Favorisierter Content</strong>
                    <p>${app.fav_content || '-'}</p>
                </div>
            ` : `
                <div class="qa-block">
                    <strong class="mc-font">Nutzungsdauer Plattformen</strong>
                    <p>${app.nutzungsdauer || '-'}</p>
                </div>
                <div class="qa-block">
                    <strong class="mc-font">Bisherige Erfahrung</strong>
                    <p>${app.erfahrung || '-'}</p>
                </div>
            `;

            let actionArea = '';
            if(app.status === 'offen') {
                actionArea = `
                    <div class="action-bar">
                        <button class="btn-action btn-accept mc-font" onclick="triggerDecision('${id}', 'angenommen')">Annehmen</button>
                        <button class="btn-action btn-reject mc-font" onclick="triggerDecision('${id}', 'abgelehnt')">Ablehnen</button>
                    </div>
                `;
            } else {
                let statusColor = app.status === 'angenommen' ? 'var(--mc-green)' : 'var(--mc-red)';
                actionArea = `
                    <div class="revert-bar">
                        <div>
                            <span class="mc-font" style="color: var(--text-muted); font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em;">Status:</span>
                            <span class="mc-font" style="color: ${statusColor}; font-size: 1.8rem; margin-left: 10px; text-shadow: 2px 2px 0px #000; letter-spacing: 0.05em;">${app.status}</span>
                        </div>
                        <button class="btn-revert mc-font" onclick="revertDecision('${id}')">Widerrufen</button>
                    </div>
                `;
            }

            detailView.className = ''; 
            if(app.status === 'angenommen') detailView.classList.add('angenommen');
            if(app.status === 'abgelehnt') detailView.classList.add('abgelehnt');

            let contentHTML = `
                <div class="detail-content">
                    ${privateWarning}
                    <div class="detail-header">
                        <img src="${bodyUrl}" alt="MC Skin" class="skin-3d" onerror="this.src='https://minotar.net/armor/body/Steve/150.png'">
                        <div>
                            <h2 class="mc-font">${nameDisplay} <span class="${badgeClass}" style="font-size: 1.2rem; margin-left: 15px;">${roleText}</span></h2>
                            
                            <div class="data-grid">
                                <div class="data-item"><strong class="mc-font">Realer Name</strong><span class="discord-tag">${app.name || '-'}</span></div>
                                <div class="data-item"><strong class="mc-font">Alter</strong><span class="discord-tag">${app.alter || '-'} Jahre</span></div>
                                <div class="data-item"><strong class="mc-font">Discord Tag</strong><span class="discord-tag">${app.discordTag || '-'}</span></div>
                                <div class="data-item"><strong class="mc-font">Datum</strong><span class="discord-tag">${date}</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="qa-section">
                        <div class="qa-block">
                            <strong class="mc-font">Persönliche Vorstellung</strong>
                            <p>${app.ueber_dich || '-'}</p>
                        </div>
                        <div class="qa-block">
                            <strong class="mc-font">Watchtime</strong>
                            <p>${app.watchtime_level || '-'}</p>
                        </div>
                        <div class="qa-block">
                            <strong class="mc-font">Lerokes bekannt seit</strong>
                            <p>${app.kennt_lerokes_seit || '-'}</p>
                        </div>
                        <div class="qa-block">
                            <strong class="mc-font">Mit Lerokes geredet?</strong>
                            <p>${app.mit_lerokes_geredet || '-'}</p>
                        </div>
                        <div class="qa-block">
                            <strong class="mc-font">Kennt Team / Community</strong>
                            <p>${app.kennt_team || '-'}</p>
                        </div>
                        ${roleQuestions}
                    </div>
                    ${actionArea}
                </div>
            `;

            detailContainer.innerHTML = contentHTML;
            listViewContainer.classList.add('hidden');
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);
        };

        window.closeDetail = function() {
            detailView.classList.add('hidden');
            listViewContainer.classList.remove('hidden');
        };

        // --- FIREBASE STATUS UPDATES ---
        window.triggerDecision = async function(id, decision) {
            const app = window.allApplications.find(a => a.id === id);
            if(!app) return;

            // Push to Firebase
            try {
                await updateDoc(doc(db, "bewerbungen", id), {
                    status: decision
                });
            } catch(e) {
                alert("Fehler beim Speichern in der Datenbank: " + e.message);
                return;
            }

            let mcName = app.minecraft_name;
            if (!mcName || mcName.trim() === '') { mcName = 'Steve'; }
            
            const toast = document.getElementById('achievement-toast');
            const backdrop = document.getElementById('achievement-backdrop');
            const title = document.getElementById('ach-title');
            const desc = document.getElementById('ach-desc');
            const icon = document.getElementById('ach-icon');

            icon.src = `https://minotar.net/helm/${mcName}/64.png`;
            toast.className = ''; 

            if(decision === 'angenommen') {
                title.innerText = "Achievement Get!";
                title.style.color = "#FFFF55";
                desc.innerText = "Spieler Angenommen!";
                toast.classList.add('accept');
            } else {
                title.innerText = "Achievement Get!";
                title.style.color = "#FF5555";
                desc.innerText = "Spieler Abgelehnt.";
                toast.classList.add('reject');
            }

            backdrop.classList.add('show');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('show'), 10);

            // Lokales Array updaten
            app.status = decision;

            setTimeout(() => {
                toast.classList.add('slide-out');
                backdrop.classList.remove('show');
                
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('show', 'slide-out'); 
                    
                    closeDetail();
                    
                    searchInput.value = '';
                    document.querySelector('.dashboard-header-area').style.display = 'flex';
                    document.querySelector('.tabs-container').style.display = 'flex';
                    
                    updateStats();
                    switchTab(decision);
                }, 500); 
            }, 2000);
        };

        window.revertDecision = async function(id) {
            const app = window.allApplications.find(a => a.id === id);
            if(!app) return;

            // Push to Firebase
            try {
                await updateDoc(doc(db, "bewerbungen", id), {
                    status: 'offen'
                });
                
                // Lokales Array updaten
                app.status = 'offen';
                updateStats();
                showDetail(id); 
                
                if(searchInput.value) {
                    renderSearchList(getFilteredApps());
                } else {
                    renderList(getFilteredApps()); 
                }
            } catch(e) {
                alert("Fehler beim Widerrufen: " + e.message);
            }
        };
    </script>
</body>
</html>
