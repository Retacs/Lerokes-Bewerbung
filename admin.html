<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Admin Dashboard</title>
    <style>
        :root {
            --accent-color: #9146FF;
            --bg-color: #09090b; 
            --card-bg: #18181b;
            --border-color: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        /* --- PREMIUM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden;}
        .hidden { display: none !important; }

        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: radial-gradient(circle at center, #18181b 0%, #09090b 100%); }
        #login-screen h1 { margin-bottom: 10px; font-size: 2.5rem; letter-spacing: -0.02em; }
        #login-screen p { color: var(--text-muted); margin-bottom: 35px; font-size: 1.1rem; }
        .btn { background-color: var(--accent-color); color: white; border: 2px solid var(--accent-color); padding: 14px 28px; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.1s ease; border-bottom: 4px solid #5b21b6; }
        .btn:hover { background-color: #a970ff; }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }

        #dashboard-screen { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px;}
        .header h1 { margin: 0; color: var(--text-main); font-size: 2rem; letter-spacing: -0.02em; text-transform: uppercase; }
        .header h1 span { color: var(--accent-color); }
        
        .search-bar { flex: 1; min-width: 250px; max-width: 400px; padding: 12px 20px; border-radius: 4px; border: 2px solid var(--border-color); background: rgba(0,0,0,0.5); color: white; font-size: 1rem; transition: 0.2s;}
        .search-bar:focus { outline: none; border-color: var(--accent-color); }
        
        .btn-secondary { background-color: #27272a; color: white; padding: 10px 20px; border-radius: 4px; border: 2px solid var(--border-color); border-bottom: 4px solid rgba(0,0,0,0.5); font-weight: bold; cursor: pointer; transition: 0.1s;}
        .btn-secondary:hover { background-color: #3f3f46; }
        .btn-secondary:active { transform: translateY(2px); border-bottom-width: 2px; }

        #list-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        .skeleton-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 20px; height: 100px; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        .fade-in-up { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s ease forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .mini-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; border-bottom: 6px solid rgba(0,0,0,0.3); padding: 20px; cursor: pointer; transition: all 0.1s ease; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .mini-card:hover { background: rgba(255,255,255,0.02); }
        .mini-card:active { transform: translateY(4px); border-bottom-width: 2px; }
        .mini-card.no-stream { border-left: 4px solid #ef4444; }

        .mini-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .mini-card h3 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;}
        
        .info-label { color: var(--text-muted); font-size: 0.8rem; font-weight: normal; margin-right: 4px;}
        .mini-card p { margin: 5px 0 0 0; font-size: 0.95rem; }
        
        .badge { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; border: 1px solid transparent; }
        .badge.mod { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.4); }
        .badge.vip { background: rgba(236, 72, 153, 0.2); color: #ec4899; border-color: rgba(236, 72, 153, 0.4); }
        
        .status-badge { font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; align-self: flex-start; }
        .status-badge.offen { background: #3f3f46; color: white; }
        .status-badge.angenommen { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-badge.abgelehnt { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .stream-alert { font-size: 0.85rem; font-weight: 900; padding: 8px 16px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; }
        .stream-alert.ok { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 2px solid #10b981; }
        .stream-alert.no { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 2px solid #ef4444; }

        #detail-view { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 40px; position: relative; overflow: hidden; }
        .detail-actions { display: flex; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 2px dashed var(--border-color); }
        
        .btn-accept { background: #10b981; color: white; border: 2px solid #047857; border-bottom: 4px solid #047857; padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.1s;}
        .btn-reject { background: #ef4444; color: white; border: 2px solid #991b1b; border-bottom: 4px solid #991b1b; padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.1s;}
        .btn-delete { background: transparent; color: #ef4444; border: 2px solid #ef4444; border-bottom: 4px solid #ef4444; padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.1s;}
        
        .btn-accept:active, .btn-reject:active, .btn-delete:active { transform: translateY(2px); border-bottom-width: 2px; }

        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; flex-direction: column; gap: 15px; }
        .detail-header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .detail-header h2 { margin: 0; font-size: 2rem; display: flex; align-items: center; gap: 15px; text-transform: uppercase;}
        
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .data-item { font-size: 1rem; }
        .data-item strong { color: var(--text-muted); display: block; margin-bottom: 6px; font-size: 0.75rem; text-transform: uppercase; }

        .text-block { background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 4px; margin-bottom: 15px;}
        .text-block strong { color: var(--accent-color); display: block; margin-bottom: 10px; font-size: 0.8rem; text-transform: uppercase;}
        .text-block p { margin: 0; font-size: 1rem; line-height: 1.6; white-space: pre-wrap; color: #d4d4d8; }

        #spoiler-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
        #spoiler-overlay h2 { color: #ef4444; font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        #spoiler-overlay p { color: var(--text-main); font-size: 1.1rem; max-width: 500px; margin-bottom: 30px; line-height: 1.5; }
        .btn-reveal { background: #ef4444; color: white; padding: 15px 30px; border: 2px solid #991b1b; border-bottom: 6px solid #991b1b; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        .btn-reveal:active { transform: translateY(4px); border-bottom-width: 2px; }
        
        .blurred-content { filter: blur(15px); opacity: 0.4; pointer-events: none; user-select: none; }

    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Dashboard <span>Lerokes</span></h1>
        <p>Nur für autorisierte Team-Mitglieder.</p>
        <button class="btn" id="login-btn">Mit Google einloggen</button>
        <p id="error-msg" style="color: #ef4444; margin-top: 20px;"></p>
    </div>

    <div id="dashboard-screen" class="hidden">
        
        <div class="header">
            <h1>Bewerbungen</h1>
            <input type="text" id="search-input" class="search-bar" placeholder="Suchen nach Name oder Discord Tag...">
            <button class="btn-secondary" id="logout-btn">Ausloggen</button>
        </div>

        <div id="list-view">
            <!-- Skeleton Loader Start -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card" style="animation-delay: 0.2s"></div>
            <div class="skeleton-card" style="animation-delay: 0.4s"></div>
        </div>

        <div id="detail-view" class="hidden">
            <button class="btn-secondary" style="margin-bottom: 20px; position: relative; z-index: 101;" onclick="closeDetail()">Zurück zur Übersicht</button>
            <div id="detail-container"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA48CGXIa3FFe8AOJ0n-uVSkPxHo1EHLOw",
            authDomain: "lerokes-bewerbung.firebaseapp.com",
            projectId: "lerokes-bewerbung",
            storageBucket: "lerokes-bewerbung.firebasestorage.app",
            messagingSenderId: "504158166281",
            appId: "1:504158166281:web:e69210f352131dcd5c47d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Hier wurde die neue E-Mail-Adresse hinzugefügt!
        const ALLOWED_EMAILS = [
            "jan.hiemer.g@gmail.com",
            "lerokes02@gmail.com",
            "racheal.helmberg161@gmail.com"
        ];

        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const searchInput = document.getElementById('search-input');
        
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        const detailContainer = document.getElementById('detail-container');

        window.allApplications = [];

        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => console.error(error));
        });

        logoutBtn.addEventListener('click', () => { signOut(auth); });

        onAuthStateChanged(auth, (user) => {
            if (user && ALLOWED_EMAILS.includes(user.email)) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                loadBewerbungen();
            } else {
                loginScreen.classList.remove('hidden');
                dashboardScreen.classList.add('hidden');
                if(user) signOut(auth);
            }
        });

        async function loadBewerbungen() {
            listView.innerHTML = `
                <div class="skeleton-card"></div>
                <div class="skeleton-card" style="animation-delay: 0.2s"></div>
                <div class="skeleton-card" style="animation-delay: 0.4s"></div>
                <div class="skeleton-card" style="animation-delay: 0.6s"></div>
            `;
            
            try {
                const querySnapshot = await getDocs(collection(db, "bewerbungen"));
                window.allApplications = [];
                
                querySnapshot.forEach((doc) => {
                    window.allApplications.push({ id: doc.id, ...doc.data() });
                });

                window.allApplications.sort((a, b) => {
                    const timeA = a.eingereicht_am ? a.eingereicht_am.toMillis() : 0;
                    const timeB = b.eingereicht_am ? b.eingereicht_am.toMillis() : 0;
                    return timeB - timeA;
                });

                renderList(window.allApplications);
            } catch (error) {
                console.error("Fehler:", error);
                listView.innerHTML = '<p style="color: #ef4444;">Fehler beim Laden der Daten.</p>';
            }
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = window.allApplications.filter(app => {
                const nameMatch = (app.name || app.alter_name || '').toLowerCase().includes(term);
                const discordMatch = (app.discordTag || '').toLowerCase().includes(term);
                return nameMatch || discordMatch;
            });
            renderList(filtered);
        });

        function renderList(apps) {
            if(apps.length === 0) {
                listView.innerHTML = '<p style="color: var(--text-muted);">Keine Bewerbungen gefunden.</p>';
                return;
            }

            let html = '';
            apps.forEach((app, index) => {
                const date = app.eingereicht_am ? new Date(app.eingereicht_am.toDate()).toLocaleDateString('de-DE') : 'Neu';
                const roleText = app.rolle === 'mod' ? 'Mod' : 'VIP';
                const badgeClass = app.rolle === 'mod' ? 'badge mod' : 'badge vip';
                const status = app.status || 'offen';
                
                const nameDisplay = app.name || app.alter_name || 'Unbekannt';
                const alterDisplay = app.alter ? ` (${app.alter})` : '';

                let streamClass = app.on_stream === 'nein' ? 'no-stream' : '';
                let streamLabel = app.on_stream === 'nein' ? '<span style="color: #ef4444; font-size: 0.75rem; font-weight: bold; border: 2px solid #ef4444; padding: 2px 6px; border-radius: 4px; margin-left: 10px;">PRIVAT</span>' : '';

                const delay = index * 0.05;

                html += `
                    <div class="mini-card fade-in-up ${streamClass}" style="animation-delay: ${delay}s" onclick="showDetail('${app.id}')">
                        <div class="mini-card-header">
                            <div>
                                <h3><span class="info-label">Name/Alter:</span>${nameDisplay}${alterDisplay} ${streamLabel}</h3>
                                <p><span class="info-label">Discord:</span>${app.discordTag || '-'}</p>
                            </div>
                            <span class="${badgeClass}">${roleText}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <span class="status-badge ${status}">${status}</span>
                            <span style="color: var(--text-muted); font-size: 0.8rem;">${date}</span>
                        </div>
                    </div>
                `;
            });
            listView.innerHTML = html;
        }

        window.removeSpoiler = function() {
            document.getElementById('spoiler-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('spoiler-overlay').style.display = 'none';
            }, 300);
            document.getElementById('actual-content').classList.remove('blurred-content');
        };

        window.showDetail = function(id) {
            const app = window.allApplications.find(a => a.id === id);
            if(!app) return;

            const date = app.eingereicht_am ? new Date(app.eingereicht_am.toDate()).toLocaleString('de-DE') : 'Gerade eben';
            const roleText = app.rolle === 'mod' ? 'Twitch Mod' : 'Twitch VIP';
            const badgeClass = app.rolle === 'mod' ? 'badge mod' : 'badge vip';
            const status = app.status || 'offen';
            
            const nameDisplay = app.name || app.alter_name || 'Unbekannt';
            const alterDisplay = app.alter ? ` (${app.alter})` : '';

            let streamAlert = '';
            let needsSpoiler = false;

            if (app.on_stream === 'ja') {
                streamAlert = `<div class="stream-alert ok">STREAM ERLAUBT</div>`;
            } else if (app.on_stream === 'nein') {
                streamAlert = `<div class="stream-alert no">STREAM VERBOTEN - PRIVAT</div>`;
                needsSpoiler = true;
            } else {
                streamAlert = `<div class="stream-alert" style="background: rgba(255,255,255,0.1); color: #fff; border: 2px solid rgba(255,255,255,0.3);">STREAM: NICHT ANGEGEBEN</div>`;
            }

            let rollenSpezifischeFragen = '';
            if (app.rolle === 'vip' && (app.warum_vip || app.fav_content)) {
                rollenSpezifischeFragen = `
                    <div class="text-block"><strong>Warum VIP?</strong><p>${app.warum_vip || '-'}</p></div>
                    <div class="text-block"><strong>Was wird am Stream gefeiert?</strong><p>${app.fav_content || '-'}</p></div>
                `;
            } else {
                rollenSpezifischeFragen = `
                    <div class="text-block"><strong>Nutzt Discord / Twitch seit</strong><p>${app.nutzungsdauer || '-'}</p></div>
                    <div class="text-block"><strong>Erfahrung im Bereich</strong><p>${app.erfahrung || '-'}</p></div>
                `;
            }

            let contentHTML = `
                <div class="detail-header">
                    <div class="detail-header-top">
                        <h2><span class="info-label" style="font-size: 1.2rem;">Name/Alter:</span>${nameDisplay}${alterDisplay} <span class="${badgeClass}" style="font-size: 0.8rem; margin-left: 10px; vertical-align: middle;">${roleText}</span></h2>
                        <span class="status-badge ${status}" style="font-size: 1rem; padding: 8px 16px;">Status: ${status.toUpperCase()}</span>
                    </div>
                    <div style="margin-top: -5px; width: 100%;">
                        ${streamAlert}
                    </div>
                </div>
                
                <div class="data-grid">
                    <div class="data-item"><strong>Discord Tag</strong>${app.discordTag || '-'}</div>
                    <div class="data-item"><strong>Eingereicht am</strong>${date}</div>
                    <div class="data-item"><strong>Watchtime / Level</strong>${app.watchtime_level || '-'}</div>
                    <div class="data-item"><strong>Schon geredet?</strong>${app.mit_lerokes_geredet === 'ja' ? 'Ja' : 'Nein'}</div>
                </div>

                <div class="text-block"><strong>Kennt Team / Community</strong><p>${app.kennt_team || '-'}</p></div>
                ${rollenSpezifischeFragen}
                <div class="text-block"><strong>Über die Person / Motivation</strong><p>${app.ueber_dich || '-'}</p></div>

                <div class="detail-actions">
                    <button class="btn-accept" onclick="updateStatus('${id}', 'angenommen')">Annehmen</button>
                    <button class="btn-reject" onclick="updateStatus('${id}', 'abgelehnt')">Ablehnen</button>
                    <button class="btn-delete" onclick="deleteBewerbung('${id}')">Löschen</button>
                </div>
            `;

            if(needsSpoiler) {
                detailContainer.innerHTML = `
                    <div id="spoiler-overlay" style="transition: opacity 0.3s ease;">
                        <h2>Privatsphäre Schutz</h2>
                        <p>Diese Bewerbung wurde als <strong>PRIVAT</strong> markiert und darf nicht im Live-Stream gezeigt werden.</p>
                        <button class="btn-reveal" onclick="removeSpoiler()">Verstanden, Bewerbung anzeigen</button>
                    </div>
                    <div id="actual-content" class="blurred-content" style="transition: filter 0.5s ease;">
                        ${contentHTML}
                    </div>
                `;
            } else {
                detailContainer.innerHTML = `
                    <div id="actual-content">
                        ${contentHTML}
                    </div>
                `;
            }

            listView.classList.add('hidden');
            searchInput.style.display = 'none';
            detailView.classList.remove('hidden');
            window.scrollTo(0, 0);
        };

        window.closeDetail = function() {
            detailView.classList.add('hidden');
            listView.classList.remove('hidden');
            searchInput.style.display = 'block';
        };

        window.updateStatus = async function(id, newStatus) {
            try {
                await updateDoc(doc(db, "bewerbungen", id), { status: newStatus });
                const appIndex = window.allApplications.findIndex(a => a.id === id);
                if(appIndex > -1) {
                    window.allApplications[appIndex].status = newStatus;
                }
                showDetail(id);
                renderList(window.allApplications);
            } catch (error) {
                console.error("Fehler beim Update:", error);
                alert("Fehler beim Speichern des Status.");
            }
        };

        window.deleteBewerbung = async function(id) {
            if(confirm("Bist du dir sicher, dass du diese Bewerbung löschen möchtest?")) {
                try {
                    await deleteDoc(doc(db, "bewerbungen", id));
                    window.allApplications = window.allApplications.filter(a => a.id !== id);
                    renderList(window.allApplications);
                    closeDetail();
                } catch (error) {
                    console.error("Fehler beim Löschen:", error);
                    alert("Konnte die Bewerbung nicht löschen.");
                }
            }
        };
    </script>
</body>
</html>
